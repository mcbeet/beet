[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "beet"
version = "0.121.0"
description = "The Minecraft pack development kit"
authors = [{ name = "Valentin Berlier", email = "berlier.v@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
  "beet",
  "minecraft",
  "datapack",
  "resourcepack",
  "mcfunction",
]

requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "click-help-colors>=0.9.4",
    "jinja2>=3.1.6",
    "nbtlib==1.12.1",
    "pathspec>=1.1.1",
    "pillow>=13.0.0",
    "platformdirs>=4.11.11",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/mcbeet/beet"

[project.scripts]
beet = "beet.toolchain.cli:main"

[project.entry-points.beet]
commands = "beet.toolchain.commands"
autoload = "beet.contrib.default"

[project.entry-points.pytest11]
beet = "beet.pytest_plugin"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-insta>=0.4.0",
    "pytest-minecraft>=0.2.0",
    "pytest-xdist>=3.8.0",
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.1",
    "zensical>=0.0.71",
]

# Remove when python-semantic-release allows the fixed click release.
[tool.uv]
override-dependencies = ["click>=8.3.1"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest]
addopts = ["tests", "--import-mode=importlib"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = "chore(release): v{version}"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/beet/__init__.py:__version__"]
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
path_filters = ["src", "pyproject.toml", "README.md", "LICENSE"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["(?!feat|fix).+"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.pyright]
failOnWarnings = false
reportImportCycles = "none"

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = [
    "SIM102",
    "SIM117",
    "BLE001",
    "RUF009",
    "RUF012",
    "S110",
    "TRY203",
    "PLR1704",
    "PLW0642",
    "S102",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "beet",
    "lectern",
    "mecha",
    "bolt",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
beet = ["beet"]
lectern = ["lectern"]
mecha = ["mecha"]
bolt = ["bolt"]
